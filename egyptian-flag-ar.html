<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>علم مصر - تجربة واقع معزز بالجسيمات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,.92);transition:opacity .6s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{color:#e3b209;font-size:1.6rem;margin-bottom:.5rem;text-shadow:0 0 20px rgba(227,178,9,.4)}
#overlay p{color:#ccc;font-size:.85rem;margin-bottom:1.5rem;text-align:center;max-width:85%;line-height:1.6}
#startBtn{padding:14px 40px;font-size:1.1rem;border:none;border-radius:30px;cursor:pointer;background:linear-gradient(135deg,#CE1126,#e3b209);color:#fff;font-weight:700;letter-spacing:1px;box-shadow:0 4px 25px rgba(206,17,38,.5);transition:transform .2s,box-shadow .2s}
#startBtn:active{transform:scale(.96)}
#arBtn{padding:10px 28px;font-size:.85rem;border:2px solid #e3b209;border-radius:25px;cursor:pointer;background:transparent;color:#e3b209;margin-top:12px;display:none;transition:background .2s}
#arBtn:active{background:rgba(227,178,9,.15)}
#hud{position:fixed;top:12px;left:12px;right:12px;z-index:5;display:none;pointer-events:none}
.badge{background:rgba(0,0,0,.55);color:#fff;padding:5px 12px;border-radius:18px;font-size:.7rem;backdrop-filter:blur(8px);display:inline-block;direction:ltr}
#controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5;display:none;gap:12px;justify-content:center}
#controls button{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:1.2rem;cursor:pointer;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;transition:background .2s}
#controls button:active{background:rgba(255,255,255,.15)}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#e3b209;font-size:.85rem;z-index:15;display:none;text-align:center}
.spinner{width:32px;height:32px;border:3px solid rgba(227,178,9,.15);border-top-color:#e3b209;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){#overlay h1{font-size:1.3rem}#overlay p{font-size:.78rem}#startBtn{padding:12px 32px;font-size:1rem}}
</style>
</head>
<body>

<div id="overlay">
  <h1>🇪🇬 علم مصر بالجسيمات</h1>
  <p>تجربة واقع معزز تفاعلية تعرض العلم المصري ونسر صلاح الدين بآلاف النقاط الملونة المتحركة</p>
  <button id="startBtn">ابدأ التجربة</button>
  <button id="arBtn">تشغيل الواقع المعزز (AR)</button>
</div>

<div id="hud"><span class="badge" id="particleCount"></span></div>

<div id="controls">
  <button id="btnReset" title="إعادة تعيين">↺</button>
  <button id="btnZoomIn" title="تكبير">+</button>
  <button id="btnZoomOut" title="تصغير">−</button>
  <button id="btnAnim" title="تبديل الحركة">◉</button>
</div>

<div id="loading"><div class="spinner"></div>جاري تحميل الجسيمات...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';

const FLAG_RATIO = 3/2;
const EAGLE_CANVAS_W = 285;
const EAGLE_CANVAS_H = 394;
const FLAG_PARTICLE_SKIP = 4;
const EAGLE_PARTICLE_SKIP = 2;
const PARTICLE_BASE_SIZE = 3.5;

let scene, camera, renderer, clock;
let flagPoints, eaglePoints;
let animationEnabled = true;
let isAR = false;
let xrSession = null;
let cameraGroup;

const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const arBtn = document.getElementById('arBtn');
const hud = document.getElementById('hud');
const controls = document.getElementById('controls');
const loadingEl = document.getElementById('loading');
const particleCountEl = document.getElementById('particleCount');

// Check WebXR support
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-ar').then(supported => {
    if (supported) arBtn.style.display = 'block';
  }).catch(() => {});
}

startBtn.addEventListener('click', () => startExperience(false));
arBtn.addEventListener('click', () => startExperience(true));

async function startExperience(withAR) {
  overlay.classList.add('hidden');
  loadingEl.style.display = 'block';

  await new Promise(r => setTimeout(r, 100));

  initThree(withAR);

  const eagleData = await sampleEagleSVG();
  const flagData = generateFlagParticles();

  createFlagParticleSystem(flagData);
  createEagleParticleSystem(eagleData);

  const total = (flagData.positions.length / 3) + (eagleData.positions.length / 3);
  particleCountEl.textContent = total.toLocaleString() + ' particles';

  loadingEl.style.display = 'none';
  hud.style.display = 'block';
  controls.style.display = 'flex';

  if (withAR) {
    try {
      await startAR();
    } catch(e) {
      console.warn('AR failed, using fallback:', e);
    }
  }

  animate();
}

function initThree(forAR) {
  scene = new THREE.Scene();
  clock = new THREE.Clock();

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
  camera.position.set(0, 0, 3.5);

  cameraGroup = new THREE.Group();
  cameraGroup.add(camera);
  scene.add(cameraGroup);

  renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, forAR ? 0 : 1);
  renderer.sortObjects = false;

  if (forAR) {
    renderer.xr.enabled = true;
  }

  document.body.appendChild(renderer.domElement);

  // Ambient light for particle visibility
  scene.add(new THREE.AmbientLight(0xffffff, 1));

  // Touch/mouse controls
  setupControls();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ---- Particle Vertex Shader with animation ----
const particleVert = `
  uniform float uTime;
  uniform float uSize;
  uniform float uAnimEnabled;
  attribute float aRandom;
  attribute float aPhase;
  varying vec3 vColor;

  void main() {
    vColor = color;
    vec3 pos = position;

    if (uAnimEnabled > 0.5) {
      float wave = sin(uTime * 1.2 + aPhase) * 0.008;
      float wave2 = cos(uTime * 0.8 + aPhase * 1.5) * 0.005;
      pos.x += wave * aRandom;
      pos.y += wave2 * aRandom;
      pos.z += sin(uTime * 0.6 + aPhase * 2.0) * 0.003 * aRandom;
    }

    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = uSize * (300.0 / -mvPosition.z);
    gl_PointSize = clamp(gl_PointSize, 1.0, 12.0);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const particleFrag = `
  varying vec3 vColor;

  void main() {
    vec2 center = gl_PointCoord - vec2(0.5);
    float dist = length(center);
    if (dist > 0.5) discard;

    float alpha = 1.0 - smoothstep(0.3, 0.5, dist);
    gl_FragColor = vec4(vColor, alpha * 0.95);
  }
`;

// ---- Eagle Vertex Shader with enhanced animation ----
const eagleVert = `
  uniform float uTime;
  uniform float uSize;
  uniform float uAnimEnabled;
  attribute float aRandom;
  attribute float aPhase;
  attribute float aDelay;
  varying vec3 vColor;
  varying float vBrightness;

  void main() {
    vColor = color;
    vec3 pos = position;

    if (uAnimEnabled > 0.5) {
      float wave = sin(uTime * 1.5 + aPhase) * 0.006;
      float wave2 = cos(uTime * 1.0 + aPhase * 1.3) * 0.004;
      pos.x += wave * aRandom;
      pos.y += wave2 * aRandom;
      pos.z += sin(uTime * 0.9 + aPhase * 1.8) * 0.004 * aRandom;
    }

    vBrightness = 0.85 + 0.15 * sin(uTime * 2.0 + aPhase);

    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = uSize * (300.0 / -mvPosition.z);
    gl_PointSize = clamp(gl_PointSize, 1.0, 14.0);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const eagleFrag = `
  varying vec3 vColor;
  varying float vBrightness;

  void main() {
    vec2 center = gl_PointCoord - vec2(0.5);
    float dist = length(center);
    if (dist > 0.5) discard;

    float alpha = 1.0 - smoothstep(0.2, 0.5, dist);
    vec3 finalColor = vColor * vBrightness;

    gl_FragColor = vec4(finalColor, alpha);
  }
`;

function sampleEagleSVG() {
  const canvas = document.createElement('canvas');
  canvas.width = EAGLE_CANVAS_W;
  canvas.height = EAGLE_CANVAS_H;
  const ctx = canvas.getContext('2d');

  // Build a standalone SVG string with explicit namespace
  const svgEl = document.getElementById('eagleSVG');
  const paths = svgEl.querySelectorAll('path, rect, g');
  let svgContent = '';
  paths.forEach(el => {
    svgContent += new XMLSerializer().serializeToString(el);
  });

  const svgString = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="570" height="787" viewBox="0 0 570 787">${svgContent}</svg>`;

  const encoded = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
  const img = new Image();

  return new Promise((resolve) => {
    img.onload = () => {
      ctx.drawImage(img, 0, 0, EAGLE_CANVAS_W, EAGLE_CANVAS_H);

      const imageData = ctx.getImageData(0, 0, EAGLE_CANVAS_W, EAGLE_CANVAS_H);
      const data = imageData.data;

      const positions = [];
      const colors = [];
      const randoms = [];
      const phases = [];
      const delays = [];

      const centerX = EAGLE_CANVAS_W / 2;
      const centerY = EAGLE_CANVAS_H / 2;
      const scale = 1.2 / EAGLE_CANVAS_H;

      for (let y = 0; y < EAGLE_CANVAS_H; y += EAGLE_PARTICLE_SKIP) {
        for (let x = 0; x < EAGLE_CANVAS_W; x += EAGLE_PARTICLE_SKIP) {
          const i = (y * EAGLE_CANVAS_W + x) * 4;
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];

          if (a < 30) continue;

          const px = (x - centerX) * scale;
          const py = -(y - centerY) * scale;
          const pz = 0.02 + Math.random() * 0.02;

          positions.push(px, py, pz);
          colors.push(r/255, g/255, b/255);
          randoms.push(Math.random() * 2 - 1);
          phases.push(Math.random() * Math.PI * 2);
          delays.push(Math.random());
        }
      }

      resolve({
        positions: new Float32Array(positions),
        colors: new Float32Array(colors),
        randoms: new Float32Array(randoms),
        phases: new Float32Array(phases),
        delays: new Float32Array(delays)
      });
    };
    img.onerror = () => {
      // Fallback: resolve with empty data
      resolve({
        positions: new Float32Array(0),
        colors: new Float32Array(0),
        randoms: new Float32Array(0),
        phases: new Float32Array(0),
        delays: new Float32Array(0)
      });
    };
    img.src = encoded;
  });
}

function generateFlagParticles() {
  const positions = [];
  const colors = [];
  const randoms = [];
  const phases = [];

  const flagW = 2.4;
  const flagH = flagW / FLAG_RATIO;
  const halfW = flagW / 2;
  const halfH = flagH / 2;

  const stripeH = flagH / 3;
  const step = flagW / (flagW / (FLAG_PARTICLE_SKIP * 0.012));

  const stripeColors = [
    [0.808, 0.067, 0.149],  // Red #CE1126
    [1.0, 1.0, 1.0],        // White
    [0.05, 0.05, 0.05]      // Black
  ];

  for (let sy = 0; sy < 3; sy++) {
    const yStart = halfH - sy * stripeH;
    const yEnd = yStart - stripeH;
    const col = stripeColors[sy];

    for (let y = yStart; y > yEnd; y -= 0.014) {
      for (let x = -halfW; x < halfW; x += 0.014) {
        // Add slight jitter
        const jx = x + (Math.random() - 0.5) * 0.006;
        const jy = y + (Math.random() - 0.5) * 0.006;

        // Vary color slightly for visual richness
        const cv = 0.95 + Math.random() * 0.1;
        positions.push(jx, jy, -0.01 + Math.random() * 0.005);
        colors.push(col[0] * cv, col[1] * cv, col[2] * cv);
        randoms.push(Math.random() * 2 - 1);
        phases.push(Math.random() * Math.PI * 2);
      }
    }
  }

  return {
    positions: new Float32Array(positions),
    colors: new Float32Array(colors),
    randoms: new Float32Array(randoms),
    phases: new Float32Array(phases)
  };
}

function createFlagParticleSystem(data) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(data.colors, 3));
  geo.setAttribute('aRandom', new THREE.BufferAttribute(data.randoms, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(data.phases, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uSize: { value: PARTICLE_BASE_SIZE },
      uAnimEnabled: { value: 1.0 }
    },
    vertexShader: particleVert,
    fragmentShader: particleFrag,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending
  });

  flagPoints = new THREE.Points(geo, mat);
  scene.add(flagPoints);
}

function createEagleParticleSystem(data) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(data.colors, 3));
  geo.setAttribute('aRandom', new THREE.BufferAttribute(data.randoms, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(data.phases, 1));
  geo.setAttribute('aDelay', new THREE.BufferAttribute(data.delays, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uSize: { value: PARTICLE_BASE_SIZE * 1.4 },
      uAnimEnabled: { value: 1.0 }
    },
    vertexShader: eagleVert,
    fragmentShader: eagleFrag,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending,
    depthTest: false
  });

  eaglePoints = new THREE.Points(geo, mat);
  eaglePoints.position.z = 0.03;
  eaglePoints.renderOrder = 2;
  scene.add(eaglePoints);
}

// ---- Controls ----
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let rotX = 0, rotY = 0;
let targetZ = 3.5;

function setupControls() {
  const el = renderer.domElement;

  el.addEventListener('pointerdown', e => {
    isDragging = true;
    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;
  });

  el.addEventListener('pointermove', e => {
    if (!isDragging || isAR) return;
    const dx = e.clientX - prevMouse.x;
    const dy = e.clientY - prevMouse.y;
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    rotX = Math.max(-1.2, Math.min(1.2, rotX));
    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;
  });

  el.addEventListener('pointerup', () => isDragging = false);
  el.addEventListener('pointercancel', () => isDragging = false);

  el.addEventListener('wheel', e => {
    targetZ += e.deltaY * 0.003;
    targetZ = Math.max(1.5, Math.min(8, targetZ));
  }, { passive: true });

  // Pinch zoom
  let lastPinchDist = 0;
  el.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastPinchDist = Math.sqrt(dx*dx + dy*dy);
    }
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && !isAR) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const delta = lastPinchDist - dist;
      targetZ += delta * 0.01;
      targetZ = Math.max(1.5, Math.min(8, targetZ));
      lastPinchDist = dist;
    }
  }, { passive: true });

  // Button controls
  document.getElementById('btnReset').addEventListener('click', () => {
    rotX = 0; rotY = 0; targetZ = 3.5;
  });
  document.getElementById('btnZoomIn').addEventListener('click', () => {
    targetZ = Math.max(1.5, targetZ - 0.5);
  });
  document.getElementById('btnZoomOut').addEventListener('click', () => {
    targetZ = Math.min(8, targetZ + 0.5);
  });
  document.getElementById('btnAnim').addEventListener('click', () => {
    animationEnabled = !animationEnabled;
  });
}

// ---- AR ----
async function startAR() {
  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test', 'local-floor'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.body }
  });

  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  isAR = true;
  xrSession = session;

  // Place flag 2m in front
  if (flagPoints) flagPoints.position.set(0, 0, -2);
  if (eaglePoints) eaglePoints.position.set(0, 0, -1.99);

  camera.position.set(0, 0, 0);
  targetZ = 0;

  session.addEventListener('end', () => {
    isAR = false;
    xrSession = null;
    camera.position.set(0, 0, 3.5);
    targetZ = 3.5;
    if (flagPoints) flagPoints.position.set(0, 0, 0);
    if (eaglePoints) eaglePoints.position.set(0, 0, 0.01);
  });
}

// ---- Animation Loop ----
function animate() {
  if (isAR) {
    renderer.setAnimationLoop(renderFrame);
  } else {
    requestAnimationFrame(function loop() {
      renderFrame();
      requestAnimationFrame(loop);
    });
  }
}

function renderFrame() {
  const t = clock.getElapsedTime();

  if (flagPoints) {
    flagPoints.material.uniforms.uTime.value = t;
    flagPoints.material.uniforms.uAnimEnabled.value = animationEnabled ? 1.0 : 0.0;
  }
  if (eaglePoints) {
    eaglePoints.material.uniforms.uTime.value = t;
    eaglePoints.material.uniforms.uAnimEnabled.value = animationEnabled ? 1.0 : 0.0;
  }

  if (!isAR) {
    camera.position.z += (targetZ - camera.position.z) * 0.08;
    cameraGroup.rotation.x += (rotX - cameraGroup.rotation.x) * 0.08;
    cameraGroup.rotation.y += (rotY - cameraGroup.rotation.y) * 0.08;
  }

  renderer.render(scene, camera);
}

})();
