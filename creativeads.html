<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>برومبت إعلان منتج (عربي/English)</title>
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="stylesheet" href="shared/tabs.css">
</head>
<body>
  <div class="logo"></div>

  <div class="container">
    <div class="header">
      <h2>برومبت إعلان منتج — Product Ad Prompt</h2>
      <button class="copy-btn" id="copyButton" aria-label="نسخ النص الحالي">نسخ النص</button>
    </div>

    <div class="tabs" role="tablist" aria-label="اختيار البرومبت">
      <button class="tab-btn" data-key="product-ar" role="tab" aria-selected="false">إعلان منتج (عربي)</button>
      <button class="tab-btn" data-key="product-en" role="tab" aria-selected="false">Product Ad (English)</button>
    </div>

    <div class="controls">
      <button class="select-btn" id="selectAll">تحديد الكل</button>
    </div>

    <div class="text" id="textToCopy"></div>
  </div>

  <div class="copied" id="copiedMsg" role="status" aria-live="polite">تم النسخ بنجاح!</div>

  <script>
    var PROMPTS = {
      "product-ar": "تصرّف كأنك مخرج إبداعي محترف ومصوّر فوتوغرافي. اكتب برومبت تفصيلي لمنتج محدد (مثال: إعلان ماسكارا)، مع التركيز على الجوانب التالية:\n- الكاميرا\n- الإضاءة\n- الأجواء (Tone)\n- التفاصيل ومواد التصنيع (Texture & material details)",
      "product-en": "Act like a professional creative director and photographer. Write a detailed prompt for a specific product (for example: mascara ads), focusing on the following aspects:\n- Camera\n- Lighting\n- Tone\n- Texture & material details"
    };
  </script>
  <script src="shared/tabs.js"></script>
</body>
</html>
