<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ WhatsApp/SEO Title -->
  <title>Prompts</title>

  <!-- ✅ Canonical -->
  <link rel="canonical" href="https://YOUR-DOMAIN.com/your-page" />

  <!-- ✅ Robots -->
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

  <!-- ✅ Description (SEO) -->
  <meta name="description" content="Prompts page: image & video prompts (Arabic/English) with one-click copy. Includes official Instagram profile references." />

  <!-- ✅ Open Graph (WhatsApp reads this) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://YOUR-DOMAIN.com/your-page" />
  <meta property="og:site_name" content="Prompts" />

  <!-- ✅ IMPORTANT: This is what WhatsApp shows -->
  <meta property="og:title" content="Prompts" />
  <meta property="og:description" content="Copy-ready Image & Video prompts (Arabic/English)." />

  <!-- ✅ Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Prompts" />
  <meta name="twitter:description" content="Copy-ready Image & Video prompts (Arabic/English)." />

  <!-- ✅ Hidden identity links (SEO signal, not visible) -->
  <link rel="me" href="https://www.instagram.com/laith.ibra/" />
  <link rel="me" href="https://www.instagram.com/xr.universe.studio/" />
  <link rel="me" href="https://www.instagram.com/ai.exper/" />

  <!-- Optional related links for crawlers (not visible) -->
  <meta property="og:see_also" content="https://www.instagram.com/laith.ibra/" />
  <meta property="og:see_also" content="https://www.instagram.com/xr.universe.studio/" />
  <meta property="og:see_also" content="https://www.instagram.com/ai.exper/" />

  <!-- ✅ Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Prompts",
    "url": "https://YOUR-DOMAIN.com/your-page",
    "description": "Image & video prompts page in Arabic and English. References official Instagram profiles.",
    "mainEntity": {
      "@type": "ItemList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "item": {
            "@type": "Person",
            "name": "Laith Ibrahim",
            "sameAs": ["https://www.instagram.com/laith.ibra/"]
          }
        },
        {
          "@type": "ListItem",
          "position": 2,
          "item": {
            "@type": "Organization",
            "name": "XR Universe Studio",
            "sameAs": ["https://www.instagram.com/xr.universe.studio/"]
          }
        },
        {
          "@type": "ListItem",
          "position": 3,
          "item": {
            "@type": "Organization",
            "name": "AI Exper",
            "sameAs": ["https://www.instagram.com/ai.exper/"]
          }
        }
      ]
    }
  }
  </script>

  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    :root{
      --bg1:#b40f8f; --bg2:#2c1d7c;
      --glass: rgba(255,255,255,0.15);
      --stroke: rgba(255,255,255,0.3);
      --text:#fff; --muted: rgba(255,255,255,0.72);
    }
    body{
      font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
      background: linear-gradient(90deg,var(--bg1) 0%,var(--bg2) 100%);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:20px;
      color:var(--text);
      direction:rtl;
      position:relative;
      overflow-x:hidden;
    }

    /* ❄️ Gentle Snow */
    .snow-overlay{
      position: fixed; inset:0;
      pointer-events:none;
      z-index:1;
      opacity:.55;
    }
    .snow-overlay::before,
    .snow-overlay::after{
      content:"";
      position:absolute;
      inset:-200px 0 0 0;
      background-image:
        radial-gradient(circle at 10px 10px, rgba(255,255,255,.55) 0 2px, transparent 3px),
        radial-gradient(circle at 30px 40px, rgba(255,255,255,.45) 0 1.6px, transparent 3px),
        radial-gradient(circle at 70px 20px, rgba(255,255,255,.35) 0 1.2px, transparent 3px);
      background-size:120px 120px;
      background-repeat:repeat;
      animation:snowFall 22s linear infinite;
    }
    .snow-overlay::after{
      opacity:.55;
      background-size:170px 170px;
      animation-duration:30s;
      filter: blur(.2px);
    }
    @keyframes snowFall{
      from{ transform: translateY(-120px); }
      to{ transform: translateY(900px); }
    }
    @media (prefers-reduced-motion: reduce){
      .snow-overlay::before,.snow-overlay::after{ animation:none; }
    }

    .container{
      background:var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border:1px solid var(--stroke);
      border-radius:20px;
      padding:25px;
      width:100%;
      max-width:900px;
      margin-top:80px;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
      position:relative;
      z-index:2;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:15px;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
      border-radius:12px 12px 0 0;
      margin-bottom:12px;
      position:sticky;
      top:0;
      z-index:10;
    }
    .header h2{
      font-size:22px;
      background: linear-gradient(90deg, #fff, #ddd);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      white-space:nowrap;
    }
    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .lang-toggle{
      display:inline-flex;
      background: rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.22);
      border-radius:12px;
      overflow:hidden;
    }
    .lang-btn{
      background:transparent;
      border:0;
      color:white;
      padding:8px 12px;
      cursor:pointer;
      font-size:13px;
      opacity:.85;
      transition: all .25s ease;
    }
    .lang-btn:hover{ opacity:1; }
    .lang-btn.active{ background: rgba(255,255,255,0.22); opacity:1; }

    .copy-btn{
      background-color: rgba(255,255,255,0.25);
      border:1px solid rgba(255,255,255,0.4);
      color:white;
      padding:8px 16px;
      border-radius:10px;
      cursor:pointer;
      transition: all .3s ease;
      font-size:14px;
      width: fit-content;
    }
    .copy-btn:hover{
      background-color: rgba(255,255,255,0.35);
      transform: translateY(-2px);
    }

    .block{
      margin-top:18px;
      padding:14px 12px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
    }

    .block-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }
    .block-title h3{
      font-size:16px;
      margin:0;
      opacity:.95;
    }

    .text{
      font-size:16px;
      line-height:1.7;
      white-space:pre-wrap;
      padding:14px 12px 6px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      min-height:240px;
    }
    .text[dir="ltr"]{
      direction:ltr;
      text-align:left;
      font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    }
    .hint{ margin-top:10px; font-size:12px; color:var(--muted); padding:0 4px; }

    .copied{
      position:fixed; top:20px; right:100px;
      background-color: rgba(255,255,255,0.25);
      padding:8px 16px;
      border-radius:8px;
      opacity:0;
      transition: opacity .3s ease;
      border:1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index:200;
    }
    .copied.show{ opacity:1; }

    hr.sep{
      border:0;
      height:1px;
      background: rgba(255,255,255,0.22);
      margin:18px 0 0 0;
    }

    @media (max-width:768px){
      .container{ padding:15px; margin-top:70px; }
      .header h2{ font-size:18px; }
      .text{ font-size:14px; }
    }
    @media (max-width:480px){
      .container{ padding:10px; }
      .header{ flex-direction:column; align-items:stretch; }
      .controls{ justify-content:center; }
      .header h2{ text-align:center; }
    }
  </style>
</head>

<body>
  <div class="snow-overlay" aria-hidden="true"></div>

  <div class="container">
    <div class="header">
      <h2 id="pageTitle">برومبتات جاهزة للنسخ</h2>

      <div class="controls">
        <div class="lang-toggle" aria-label="Language toggle">
          <button class="lang-btn active" id="btnAR" type="button">عربي</button>
          <button class="lang-btn" id="btnEN" type="button">English</button>
        </div>
      </div>
    </div>

    <!-- Image Prompt -->
    <div class="block">
      <div class="block-title">
        <h3 id="imgTitle">🖼️ برومبت الصورة</h3>
        <button class="copy-btn" id="copyImage" type="button">نسخ برومبت الصورة</button>
      </div>
      <div class="text" id="imgText" dir="rtl"></div>
      <div class="hint" id="imgHint">انسخ برومبت الصورة (عربي/إنكليزي) حسب اللغة المختارة.</div>
    </div>

    <hr class="sep"/>

    <!-- Video Prompt -->
    <div class="block">
      <div class="block-title">
        <h3 id="vidTitle">🎥 برومبت الفيديو</h3>
        <button class="copy-btn" id="copyVideo" type="button">نسخ برومبت الفيديو</button>
      </div>
      <div class="text" id="vidText" dir="rtl"></div>
      <div class="hint" id="vidHint">انسخ برومبت الفيديو (عربي/إنكليزي) حسب اللغة المختارة.</div>
    </div>

  </div>

  <div class="copied" id="copiedMsg">تم النسخ بنجاح!</div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btnAR = document.getElementById('btnAR');
      const btnEN = document.getElementById('btnEN');

      const imgText   = document.getElementById('imgText');
      const vidText   = document.getElementById('vidText');

      const copyImage = document.getElementById('copyImage');
      const copyVideo = document.getElementById('copyVideo');

      const pageTitle = document.getElementById('pageTitle');
      const imgTitle  = document.getElementById('imgTitle');
      const vidTitle  = document.getElementById('vidTitle');

      const imgHint   = document.getElementById('imgHint');
      const vidHint   = document.getElementById('vidHint');

      const copiedMsg = document.getElementById('copiedMsg');

      // =========================
      // PROMPTS (IMAGE)
      // =========================
      const PROMPT_IMAGE_AR = `أنشئ صورة تُظهر المرأة من الصورة المرجعية وهي تتحرك بشكل طبيعي لالتقاط صورة سيلفي مع (اسم الممثل أو الشخصية) في موقع تصوير (اسم الفيلم أو المسلسل).

حافظ على تفاصيل الوجه الأصلية للصورة المرجعية دون أي تعديل. حافظ على الملامح الطبيعية وملمس البشرة الحقيقي، مع عدم تغيير الملابس الأصلية.

في الخلفية، أظهر موقع التصوير بوضوح بما يشمل الإضاءة، الدعائم، وطاقم العمل.

احفظ تفاصيل الوجه كما هي، وحافظ على نفس اتجاه اليد كما في الصور المرجعية.`;

      const PROMPT_IMAGE_EN = `Generate an image showing the woman from the provided photo naturally moving to take a selfie with (actor or character name) on the filming set of (movie or TV series name).
Preserve the exact facial details of the person in the reference image without any modification. Maintain natural features, real skin texture, and keep the woman’s original clothing unchanged.
In the background, clearly show the film set, including lighting, props, and the production crew.
Preserve the facial details of the reference image and maintain the same hand orientation as shown in the reference photos.`;

      // =========================
      // PROMPTS (VIDEO) - NEW
      // =========================
      const PROMPT_VIDEO_EN = `Base the character strictly on the provided reference images. The woman's facial appearance must remain completely unchanged throughout the video, including facial structure, proportions, skin tone, and natural skin texture. No enhancement, alteration, or visual correction is allowed. Create a highly realistic selfie-like video set in the same room. In one seamless shot, the woman naturally shifts her position by taking one or two relaxed steps, subtly adjusting the framing so she appears alongside another person. The overall feeling is light, warm, and positive. Her expression remains calm and friendly, with a gentle smile maintained consistently from start to finish. All movement must be minimal and realistic, reflecting natural human behavior only. No visible phone should appear, yet the recording must clearly feel like a genuine selfie. Camera angle stays steady, transitions are smooth, lighting remains balanced, and the woman's identity stays perfectly stable with no facial distortion at any moment.`;

      const PROMPT_VIDEO_AR = `اعتمد في بناء الشخصية بشكل صارم على الصور المرجعية المرفقة. يجب أن تبقى ملامح وجه المرأة ثابتة تمامًا طوال الفيديو بدون أي تغيير، بما يشمل بنية الوجه، النِّسَب، لون البشرة، وملمس البشرة الطبيعي. يُمنع أي تحسين أو تعديل أو تصحيح بصري.

أنشئ فيديو واقعي جدًا بأسلوب “سيلفي” داخل نفس الغرفة. ضمن لقطة واحدة سلسة، تتحرك المرأة بشكل طبيعي عبر خطوة أو خطوتين هادئتين لتعديل الكادر بشكل بسيط، بحيث تظهر بجانب شخص آخر.

الإحساس العام خفيف ودافئ وإيجابي. تبقى تعابيرها هادئة وودودة، مع ابتسامة لطيفة ثابتة من البداية للنهاية.

يجب أن تكون الحركة قليلة جدًا وواقعية وتعكس سلوكًا بشريًا طبيعيًا فقط. لا يجب أن يظهر أي هاتف في الفيديو، ومع ذلك يجب أن يبدو التسجيل بوضوح كأنه سيلفي حقيقي. زاوية الكاميرا ثابتة، الانتقالات ناعمة، الإضاءة متوازنة، وهوية المرأة ثابتة تمامًا دون أي تشوه أو تغير في الوجه في أي لحظة.`;

      // =========================
      // STATE
      // =========================
      let currentLang = 'ar';

      function showCopiedToast(msg){
        copiedMsg.textContent = msg;
        copiedMsg.classList.add('show');
        setTimeout(()=>copiedMsg.classList.remove('show'), 2000);
      }

      function copyText(text){
        navigator.clipboard.writeText(text).then(()=>{
          showCopiedToast(currentLang === 'ar' ? 'تم النسخ بنجاح!' : 'Copied!');
        }).catch((err)=>{
          console.error('فشل في نسخ النص:', err);
          alert(currentLang === 'ar'
            ? 'حدث خطأ أثناء محاولة النسخ، يرجى المحاولة مرة أخرى'
            : 'Copy failed. Please try again.');
        });
      }

      function setLang(lang){
        currentLang = lang;

        if(lang === 'ar'){
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';

          imgText.setAttribute('dir','rtl');
          vidText.setAttribute('dir','rtl');

          imgText.textContent = PROMPT_IMAGE_AR;
          vidText.textContent = PROMPT_VIDEO_AR;

          btnAR.classList.add('active'); btnEN.classList.remove('active');

          pageTitle.textContent = 'برومبتات جاهزة للنسخ';
          imgTitle.textContent  = '🖼️ برومبت الصورة';
          vidTitle.textContent  = '🎥 برومبت الفيديو';

          copyImage.textContent = 'نسخ برومبت الصورة';
          copyVideo.textContent = 'نسخ برومبت الفيديو';

          imgHint.textContent = 'انسخ برومبت الصورة (عربي/إنكليزي) حسب اللغة المختارة.';
          vidHint.textContent = 'انسخ برومبت الفيديو (عربي/إنكليزي) حسب اللغة المختارة.';
        }else{
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';

          imgText.setAttribute('dir','ltr');
          vidText.setAttribute('dir','ltr');

          imgText.textContent = PROMPT_IMAGE_EN;
          vidText.textContent = PROMPT_VIDEO_EN;

          btnEN.classList.add('active'); btnAR.classList.remove('active');

          pageTitle.textContent = 'Copy-ready Prompts';
          imgTitle.textContent  = '🖼️ Image Prompt';
          vidTitle.textContent  = '🎥 Video Prompt';

          copyImage.textContent = 'Copy Image Prompt';
          copyVideo.textContent = 'Copy Video Prompt';

          imgHint.textContent = 'Copy the Image prompt (Arabic/English) based on the selected language.';
          vidHint.textContent = 'Copy the Video prompt (Arabic/English) based on the selected language.';
        }
      }

      // EVENTS
      btnAR.addEventListener('click', ()=>setLang('ar'));
      btnEN.addEventListener('click', ()=>setLang('en'));

      copyImage.addEventListener('click', ()=>{
        copyText(imgText.textContent);
      });

      copyVideo.addEventListener('click', ()=>{
        copyText(vidText.textContent);
      });

      // INIT
      setLang('ar');
    });
  </script>
</body>
</html>
