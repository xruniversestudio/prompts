<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>برومبت تمثال شخصية</title>
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="stylesheet" href="shared/tabs.css">
</head>
<body>
  <div class="logo"></div>

  <div class="container">
    <div class="header">
      <h2>برومبت تمثال شخصية 1/7</h2>
      <button class="copy-btn" id="copyButton" aria-label="نسخ النص الحالي">نسخ النص</button>
    </div>

    <div class="tabs" role="tablist" aria-label="اختيار البرومبت">
      <button class="tab-btn" data-key="statue-ar" role="tab" aria-selected="false">تمثال 1/7 (عربي)</button>
      <button class="tab-btn" data-key="statue-en" role="tab" aria-selected="false">Statue 1/7 (English)</button>
    </div>

    <div class="controls">
      <button class="select-btn" id="selectAll">تحديد الكل</button>
    </div>

    <div class="text" id="textToCopy"></div>
  </div>

  <div class="copied" id="copiedMsg" role="status" aria-live="polite">تم النسخ بنجاح!</div>

  <script>
    var PROMPTS = {
      "statue-ar": "تمثال واقعي للغاية بنسبة 1/7 مصنوع من الراتنج، يعتمد على [الصورة المرجعية]، ويحافظ على ملامح الوجه الحقيقية، وتسريحة الشعر، وهيئة الجسم كما هي في المرجع.\nيجب أن يمتلك التمثال نسيج جلد طبيعي، مسامًا دقيقة، طلاءً واقعيًا، وانعكاسات ضوئية ناعمة، لتجنّب مظهر اللعبة البلاستيكية.\n\nالشخصية ترتدي [تفاصيل_الملابس]، في وضعية [تفاصيل_الوضعية]، وتقف على قاعدة أكريليك شفافة فوق مكتب خشبي.\nخلفها شاشة كمبيوتر تعرض عملية النمذجة ثلاثية الأبعاد للشخصية نفسها.\n\nهي [المهنة/الهواية]، لذا تُحاط بعناصر بصرية مرتبطة بمجالها المهني أو هواياتها.\nإلى جانب التمثال، ضع صندوق تغليف أكبر يضم صورة مطبوعة واقعية للشخصية (مأخوذة من المرجع، لكن محدّثة بالملابس والوضعية المختارتين).\n\nالمشهد في بيئة داخلية بإضاءة سينمائية دافئة، وعمق مجال ضحل، وأسلوب تصوير منتجات واقعي بعدسة ماكرو احترافية.",
      "statue-en": "A highly realistic 1/7 scale resin statue based on [REFERENCE IMAGE], preserving the exact facial features, hairstyle, and body of the reference.\nThe statue should have natural skin texture, subtle pores, realistic paint finish, and soft light reflections, avoiding the look of a toy.\n\nThe character is wearing [OUTFIT DETAILS], posed [POSE DETAILS], and stands on a transparent acrylic base on a wooden desk.\nBehind her, a monitor displays the 3D modeling process of the same character.\n\nShe is a [JOB / HOBBY DESCRIPTION], so she is surrounded by elements related to her profession and hobbies.\nNext to the statue, add a larger packaging box with a realistic printed photo of the character (derived from the reference, but updated with the chosen outfit and pose).\n\nThe environment is indoors with cinematic warm studio lighting, shallow depth of field, and professional macro lens product-photography style."
    };
  </script>
  <script src="shared/tabs.js"></script>
</body>
</html>
